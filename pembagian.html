<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Belajar Pembagian - Math Kids</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="pembagian">

  <button id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>

  <div class="sidebar">
    <h2>MATEMATIKA MINUL</h2>
    <ul>
      <li><a href="index.html" data-icon="🏠">Beranda</a></li>
      <li><a href="penjumlahan.html" data-icon="➕">Penjumlahan</a></li>
      <li><a href="pengurangan.html" data-icon="➖">Pengurangan</a></li>
      <li><a href="perkalian.html" data-icon="✖️">Perkalian</a></li>
      <li><a href="pembagian.html" class="active" data-icon="➗">Pembagian</a></li>
    </ul>
  </div>

  <main class="main-content">
    <h1>Belajar Pembagian</h1>
    <div id="main-content">
      <div id="question-container" class="fade-in-up" style="font-size: 1.8rem; margin-bottom: 20px; user-select:none;">
        <p id="question-text"></p>
        <p id="story-text" style="font-size: 1.2rem; margin-top: 10px; color: #555;"></p>
      </div>
      <input type="number" id="answer-input" placeholder="Masukkan jawabanmu" style="font-size: 1.5rem; padding: 10px; border-radius: 10px; border: 2px solid var(--color-blue);" />
      <p id="feedback" style="font-size: 1.3rem; margin-top: 10px; min-height: 30px; user-select:none;"></p>
      <button id="check-btn" onclick="checkAnswer()">Cek Jawaban</button>
      <button id="next-btn" onclick="nextQuestion()" style="display:none;">Selanjutnya</button>
      <div class="progress-container" style="margin-top: 20px;">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="score" style="font-size: 1.2rem; user-select:none;"></p>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script>
    

    function showQuestion() {
      const questionObj = quizzes.pembagian[currentQuestionIndex];
      const questionEl = document.getElementById("question-text");
      const storyEl = document.getElementById("story-text");
      questionEl.textContent = questionObj.question;
      storyEl.textContent = divisionStories[currentQuestionIndex] || "";
      questionEl.classList.remove("fade-in-up");
      void questionEl.offsetWidth;
      questionEl.classList.add("fade-in-up");
      storyEl.classList.remove("fade-in-up");
      void storyEl.offsetWidth;
      storyEl.classList.add("fade-in-up");

      $("answer-input").value = "";
      $("feedback").textContent = "";
      $("feedback").className = "";
      $("next-btn").style.display = "none";
      $("answer-input").disabled = false;
    }
  </script>
  <div id="notification"></div>
  <script src="script.js"></script>
  <script src="sidebar-toggle.js"></script>
</body>
</html>
